<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>wavullet</title>
<meta name="description" content="wavullet">
<style>
:root{--bg:#fff;--fg:#1c1e21;--sub:#5b6168;--line:#d9dde1;--accent:#c62828;--th:#f2f4f6}
@media (prefers-color-scheme:dark){:root{--bg:#121315;--fg:#e8eaed;--sub:#9aa0a6;--line:#2c2f33;--accent:#ff6b5e;--th:#1c1e21}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,"Segoe UI","Noto Sans KR","Malgun Gothic",Roboto,sans-serif}
main{max-width:860px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:1.7rem;line-height:1.25;margin:.2em 0 .6em}h2{font-size:1.2rem;margin-top:1.8em}
a{color:var(--accent)}nav{font-size:.9rem;color:var(--sub);margin-bottom:8px}nav a{margin-right:12px}
.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.92rem;margin:1em 0}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}th{background:var(--th)}
code{background:var(--th);padding:1px 5px;border-radius:4px;font-size:.9em}
footer{margin-top:3em;color:var(--sub);font-size:.85rem;border-top:1px solid var(--line);padding-top:12px}
</style>
</head>
<body>
<main>

<h1>wavullet</h1>
<p>Apps and tools.</p>
<ul>
<li><a href="excluster/">ExCluster</a> — a phone as an instrument cluster (Android)</li>
</ul>
<footer>wavullet</footer>
</main>
</body>
</html>
